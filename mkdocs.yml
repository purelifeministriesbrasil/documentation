site_name: Pure Life Ministries Brasil — Documentação Técnica
site_description: Arquitetura, especificações, contratos de dados, segurança LGPD e runbooks do ecossistema Pure Life Ministries Brasil.
site_author: Pure Life Ministries Brasil
site_url: https://purelifeministriesbrasil.github.io/documentation/

repo_name: purelifeministriesbrasil/frontend
repo_url: https://github.com/purelifeministriesbrasil/frontend

theme:
  name: material
  language: pt-BR
  logo: assets/images/PLM_Logo.png
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo claro
  font:
    text: Montserrat
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Começando:
      - Visão Rápida: getting-started/quickstart.md
      - Variáveis de Ambiente: getting-started/environment.md
      - Configuração do Supabase: getting-started/supabase-setup.md
  - Arquitetura:
      - Visão Geral do Sistema: architecture/system-overview.md
      - Diagramas de Sequência: architecture/sequence-diagrams.md
      - Modelo de Dados: architecture/data-model.md
  - Decisões (ADRs):
      - Índice de ADRs: adrs/index.md
      - ADR-001 - Astro SSG & Tailwind v4: adrs/ADR-001-astro-ssg-tailwind.md
      - ADR-002 - Supabase como Plataforma de Dados: adrs/ADR-002-supabase-plataforma-dados.md
      - ADR-003 - Hospedagem e Borda na Vercel: adrs/ADR-003-vercel-hospedagem-borda.md
      - ADR-004 - Criptografia AES-256-GCM com AAD: adrs/ADR-004-criptografia-aes-gcm-aad.md
      - ADR-005 - Modelo de Lease e Idempotência: adrs/ADR-005-modelo-lease-idempotencia.md
  - Schemas & Validação:
      - Formulário de Triagem: schemas/triage-schema.md
      - Formulário de Contato: schemas/contact-schema.md
      - Doações & PIX: schemas/donation-schema.md
      - Inscrição em Newsletter: schemas/newsletter-schema.md
  - Segurança & LGPD:
      - Modelagem de Ameaças: security/threat-model.md
      - Conformidade com a LGPD: security/lgpd-compliance.md
      - Arquitetura Criptográfica: security/crypto-architecture.md
  - Design System:
      - Guia de Estilo e Componentes: design-system/design-system.md
  - Operações & Runbooks:
      - Deploy na Vercel: operations/deployment.md
      - Backup & Recuperação: operations/backup-recovery.md
      - Rotação de Chaves: operations/key-rotation.md
      - CLI Cheatsheet: operations/cli-cheatsheet.md
  - Requisitos & Glossário:
      - Especificação de Requisitos (SRS): requirements/especificacao-requisitos-ecossistema.md
      - Glossário Canónico: glossary/glossary.md
  - Governança:
      - Código de Conduta: governance/code-of-conduct.md
      - Como Contribuir: governance/contributing.md
      - Política de Segurança: governance/security-policy.md
      - Licença: governance/license.md

