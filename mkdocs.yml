site_name: Pure Life Ministries Brasil
site_description: Arquitetura de software, especificações de requisitos, controles de privacidade (LGPD), contratos de dados e runbooks do ecossistema Pure Life Ministries Brasil.
site_author: Pure Life Ministries Brasil
site_url: https://purelifeministriesbrasil.github.io/documentation/

repo_name: GitHub
repo_url: https://github.com/purelifeministriesbrasil/documentation
edit_uri: edit/main/docs/
copyright: "© 2026 Pure Life Ministries Brasil — Liderando Cristãos à Pureza desde 1986"

theme:
  name: material
  language: pt-BR
  logo: assets/images/PLM_Logo-header.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
    annotation: material/arrow-right-circle
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo claro
  font:
    text: Montserrat
    code: JetBrains Mono

extra:
  analytics:
    feedback:
      title: Esta página foi útil?
      ratings:
        - icon: material/thumb-up-outline
          name: Sim, foi útil
          data: 1
          note: Obrigado pelo retorno!
        - icon: material/thumb-down-outline
          name: Pode melhorar
          data: 0
          note: >-
            Obrigado! Conte o que faltou abrindo uma
            <a href="https://github.com/purelifeministriesbrasil/documentation/issues/new" target="_blank" rel="noopener">issue no GitHub</a>.

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/interactions.js

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      type: date
      locale: pt
      timezone: America/Sao_Paulo
      fallback_to_build_date: true
      enable_creation_date: false
  - glightbox:
      touchNavigation: true
      skip_classes:
        - no-lightbox

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Arquitetura:
      - Visão Geral do Sistema: architecture/system-overview.md
      - Fronteiras dos Repositórios: architecture/repositories-scope.md
      - Camadas do Backend: architecture/backend-layers.md
      - Estrutura do Frontend: architecture/frontend-structure.md
      - Diagramas de Sequência: architecture/sequence-diagrams.md
      - Modelo de Dados Relacional: architecture/data-model.md
      - Design System & Componentes: design-system/design-system.md
      - Decisões de Arquitetura (ADRs):
          - Índice de Decisões: adrs/index.md
          - ADR-001 — Astro SSG & Tailwind v4: adrs/ADR-001-astro-ssg-tailwind.md
          - ADR-002 — Supabase como Plataforma de Dados (substituído): adrs/ADR-002-supabase-plataforma-dados.md
          - ADR-003 — Hospedagem na Vercel (substituído): adrs/ADR-003-vercel-hospedagem-borda.md
          - ADR-004 — Criptografia AES-256-GCM com AAD: adrs/ADR-004-criptografia-aes-gcm-aad.md
          - ADR-005 — Modelo de Lease e Idempotência: adrs/ADR-005-modelo-lease-idempotencia.md
          - ADR-006 — Modernização Workers, Hono & Supabase: adrs/ADR-006-modernizacao-workers-hono-supabase.md
          - ADR-007 — Cloudflare Pages & Contas Institucionais: adrs/ADR-007-cloudflare-pages-contas-institucionais.md
          - ADR-008 — Neon Postgres & Hyperdrive: adrs/ADR-008-neon-hyperdrive.md
          - ADR-009 — Performance (Preact, zod/mini, imagens): adrs/ADR-009-performance-ilhas-preact-imagens.md
  - Segurança & LGPD:
      - Modelagem de Ameaças: security/threat-model.md
      - Controles de Privacidade (LGPD): security/lgpd-compliance.md
      - Arquitetura Criptográfica: security/crypto-architecture.md
      - Inventário de Retenção: security/data-retention.md
      - Política de Segurança da Informação: governance/security-policy.md
  - Contratos:
      - Contratos Comuns: schemas/common-schema.md
      - Formulário de Triagem: schemas/triage-schema.md
      - Formulário de Contato: schemas/contact-schema.md
      - Doações & PIX Dinâmico: schemas/donation-schema.md
      - Inscrição em Newsletter: schemas/newsletter-schema.md
  - Operações:
      - Começar:
          - Guia Rápido de Instalação: getting-started/quickstart.md
          - Variáveis de Ambiente: getting-started/environment.md
          - Configuração do Banco (Neon): getting-started/database-setup.md
      - Manutenção do Site:
          - Guia do Mantenedor: operations/maintainer-guide.md
          - Gestão de Conteúdo do Site: operations/content-management.md
          - CLI Cheatsheet: operations/cli-cheatsheet.md
      - Implantação e Produção:
          - Runbook de Implantação: operations/deployment.md
          - Checklist de Go-live: operations/go-live-checklist.md
          - DNS, E-mail e Borda: operations/dns-and-email.md
          - Backup & Recuperação: operations/backup-recovery.md
          - Rotação de Chaves Criptográficas: operations/key-rotation.md
          - Resposta a Incidentes: operations/incident-response.md
          - Observabilidade & Monitoramento: operations/observability.md
          - Hardening do Banco: operations/database-hardening.md
          - Migração do Site Antigo: operations/legacy-migration.md
      - Qualidade & DevOps:
          - Testes e CI/CD: quality/testing-and-cicd.md
          - Dependências, Segurança Contínua e Releases: quality/dependency-updates.md
          - Proteção de Branches: operations/branch-protection.md
  - Governança:
      - Requisitos (SRS):
          - Visão Geral (SRS): requirements/index.md
          - Requisitos Funcionais: requirements/functional.md
          - Regras de Negócio: requirements/business-rules.md
          - Requisitos Não-Funcionais: requirements/non-functional.md
      - Diretrizes de Contribuição: governance/contributing.md
      - Guia de Estilo da Documentação: governance/documentation-style.md
      - Código de Conduta: governance/code-of-conduct.md
      - Licença e Termos de Uso: governance/license.md
      - Glossário Técnico: glossary/glossary.md