name: Validate docs

# Valida a documentação em pull requests, sem publicar nada (o deploy continua só em push na main).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdocs-strict:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build documentation with MkDocs (strict)
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
